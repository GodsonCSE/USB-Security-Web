# ---------------------------------------------------------------
# USB Device Security Monitor - Spring Boot Configuration
# Zero-config default: Runs out of the box with embedded H2 database.
# (Optional) Switch to MySQL by setting USB_MONITOR_DB_URL & USB_MONITOR_DB_PASSWORD
# ---------------------------------------------------------------

# Server
server.port=8080

# DataSource — Zero config embedded H2 database (persisted to ./data/usb_security_db)
spring.datasource.url=${USB_MONITOR_DB_URL:jdbc:h2:file:./data/usb_security_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${USB_MONITOR_DB_USER:sa}
spring.datasource.password=${USB_MONITOR_DB_PASSWORD:}
spring.datasource.driver-class-name=${USB_MONITOR_DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console (disabled by default for security outside local dev)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# USB Monitor settings
usb.monitor.poll-interval-ms=${USB_MONITOR_POLL_MS:2000}
usb.monitor.simulate=${USB_MONITOR_SIMULATE:false}

# Logging
logging.level.com.usbsecurity=INFO
logging.level.org.hibernate=WARN
